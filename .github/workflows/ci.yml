name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

env:
  GO_VERSION: '1.25.1'

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      
      - name: Format check
        run: |
          cd backend
          gofmt -l .
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then exit 1; fi
      
      - name: Vet
        run: cd backend && go vet ./...
      
      - name: Lint
        uses: golangci/golangci-lint-action@v6  # Updated to v6
        with:
          version: latest
          working-directory: backend
          args: --timeout=5m --issues-exit-code=0  # Don't fail on lint warnings initially

  unit-tests:
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      
      - name: Run tests
        run: |
          cd backend
          go test -v -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

  build-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Build
        run: |
          cd backend
          go build -v -o app ./cmd/main.go
      
      - name: Docker build
        run: |
          cd backend
          docker build -t mastering-actions:test .