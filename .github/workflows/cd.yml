name: CD Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    if: github.event.inputs.environment == 'staging' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Staging
        run: |
          echo "🚀 Deploying version: ${GITHUB_REF#refs/tags/}"
          echo "📦 Environment: Staging"
          echo "✅ Deployment successful!"
      
      - name: Smoke Tests
        run: |
          echo "🏥 Running smoke tests..."
          echo "✅ All tests passed!"

  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-staging
    if: github.event.inputs.environment == 'production' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Production
        run: |
          echo "🚀 Deploying version: ${GITHUB_REF#refs/tags/}"
          echo "📦 Environment: Production"
          echo "✅ Deployment successful!"
          echo "🎉 Release complete!"