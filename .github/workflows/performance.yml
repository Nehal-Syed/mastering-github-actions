name: Performance Monitoring

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
      
      - name: Run benchmark tests
        run: |
          cd backend
          go test -bench=. -benchmem ./... || echo "No benchmarks found"